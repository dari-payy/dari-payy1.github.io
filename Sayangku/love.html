<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Untukmu, Cintaku ❤</title>
<style>
  :root{
    --bg1:#2b0a1f; --bg2:#7a1346; --pink:#ff4d88; --soft:#ffd1e3; --white:#fff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Segoe UI",system-ui,sans-serif;
    background:radial-gradient(circle at 50% 30%,var(--bg2),var(--bg1) 70%);
    color:var(--white);
    overflow-x:hidden;
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;
    padding:24px 16px 40px;
  }
  #hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .float{
    position:absolute;bottom:-40px;
    animation:rise linear forwards;
    opacity:.8;
  }
  @keyframes rise{
    to{transform:translateY(-110vh) rotate(40deg);opacity:0}
  }

  main{position:relative;z-index:1;width:100%;max-width:560px;text-align:center}

  h1{
    font-family:Georgia,"Times New Roman",serif;
    font-size:clamp(1.6rem,6vw,2.4rem);
    margin:8px 0 4px;
    text-shadow:0 0 18px rgba(255,77,136,.8);
  }
  .sub{color:var(--soft);font-size:.95rem;margin-bottom:10px}

  /* HATI BESAR */
  .heart-wrap{
    position:relative;width:min(88vw,380px);aspect-ratio:1/1;margin:10px auto;
    cursor:pointer;
    animation:beat 1.3s ease-in-out infinite;
    filter:drop-shadow(0 0 28px rgba(255,77,136,.85));
  }
  .heart-wrap svg{width:100%;height:100%}
  .heart-text{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    padding:0 18%;padding-bottom:8%;
    font-family:Georgia,serif;
    font-size:clamp(1.1rem,5vw,1.7rem);
    font-weight:bold;
    text-shadow:0 2px 8px rgba(0,0,0,.35);
    line-height:1.25;
  }
  @keyframes beat{
    0%,100%{transform:scale(1)}
    15%{transform:scale(1.09)}
    30%{transform:scale(1)}
    45%{transform:scale(1.06)}
  }
  .hint{font-size:.85rem;color:var(--soft);opacity:.85;margin-bottom:14px}

  /* KARTU UCAPAN */
  .card{
    background:rgba(255,255,255,.09);
    border:1px solid rgba(255,255,255,.2);
    backdrop-filter:blur(8px);
    border-radius:20px;
    padding:20px 18px;
    margin-top:14px;
    text-align:left;
  }
  #message{
    font-size:1.05rem;line-height:1.7;min-height:7em;white-space:pre-wrap;
    font-family:Georgia,serif;
  }
  .sign{margin-top:12px;text-align:right;font-style:italic;color:var(--soft)}

  /* MUSIK */
  .card h2{font-size:1.05rem;margin-bottom:10px;color:var(--soft)}
  .music-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .btn{
    background:var(--pink);color:#fff;border:none;border-radius:999px;
    padding:10px 18px;font-size:.95rem;cursor:pointer;font-weight:600;
    box-shadow:0 4px 14px rgba(255,77,136,.45);
    transition:transform .15s;
  }
  .btn:hover{transform:scale(1.05)}
  .btn.ghost{background:rgba(255,255,255,.15);box-shadow:none}
  input[type=file]{display:none}
  input[type=text],textarea{
    width:100%;padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.3);
    background:rgba(0,0,0,.25);color:#fff;font-size:.95rem;font-family:inherit;margin-top:8px;
  }
  textarea{min-height:110px;resize:vertical}
  audio{width:100%;margin-top:12px;border-radius:12px}
  .track{font-size:.85rem;color:var(--soft);margin-top:8px;word-break:break-all}

  details summary{cursor:pointer;color:var(--soft);font-weight:600}
  .label{font-size:.85rem;color:var(--soft);margin-top:10px;display:block}
  footer{margin-top:22px;font-size:.8rem;color:var(--soft);opacity:.7;position:relative;z-index:1}
</style>
</head>
<body>

<div id="hearts"></div>

<main>
  <h1 id="title">Untuk <span id="nameSpan">Sayangku</span> ❤</h1>
  <div class="sub">Sebuah pesan kecil dari hati yang besar</div>

  <div class="heart-wrap" id="heart" title="Klik aku!">
    <svg viewBox="0 0 512 460" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ff7aa8"/>
          <stop offset="1" stop-color="#d4145a"/>
        </linearGradient>
      </defs>
      <path fill="url(#g)" d="M256 450C120 340 8 250 8 140 8 70 62 16 130 16c52 0 100 30 126 76C282 46 330 16 382 16c68 0 122 54 122 124 0 110-112 200-248 310z"/>
      <path fill="rgba(255,255,255,.22)" d="M90 70c-30 22-48 56-40 96 4-30 22-62 56-84 20-14 40-12 52-4-20-16-48-18-68-8z"/>
    </svg>
    <div class="heart-text" id="heartText">I Love You</div>
  </div>
  <div class="hint">Klik hati untuk hujan cinta 💕 dan memutar musik</div>

  <div class="card">
    <div id="message"></div>
    <div class="sign" id="sign">— Dari aku, yang selalu sayang kamu</div>
  </div>

  <div class="card">
    <h2>🎵 Tempat Musik</h2>
    <div class="music-row">
      <label class="btn" for="musicFile">📁 Pilih Lagu dari HP/Laptop</label>
      <input type="file" id="musicFile" accept="audio/*">
      <button class="btn ghost" id="playBtn">▶ Putar / Jeda</button>
    </div>
    <input type="text" id="musicUrl" placeholder="Atau tempel link langsung lagu (.mp3) lalu tekan Enter">
    <audio id="player" controls loop></audio>
    <div class="track" id="trackName">Belum ada lagu dipilih.</div>
  </div>

  <div class="card">
    <details>
      <summary>✏️ Ubah Nama &amp; Ucapan</summary>
      <label class="label">Nama pacar kamu</label>
      <input type="text" id="inName" placeholder="Contoh: Putri">
      <label class="label">Tulisan di dalam hati</label>
      <input type="text" id="inHeart" placeholder="Contoh: I Love You">
      <label class="label">Isi ucapan</label>
      <textarea id="inMsg"></textarea>
      <label class="label">Tanda tangan</label>
      <input type="text" id="inSign" placeholder="Contoh: — Dari Budi">
      <div class="music-row" style="margin-top:12px">
        <button class="btn" id="saveBtn">💾 Terapkan</button>
        <button class="btn ghost" id="resetBtn">Kembalikan</button>
      </div>
    </details>
  </div>
</main>

<footer>Dibuat dengan cinta ❤</footer>

<script>
(function(){
  var DEFAULT = {
    name: "Sayangku",
    heart: "I Love You",
    sign: "— Dari aku, yang selalu sayang kamu",
    msg: "Hai sayang,\n\nTerima kasih sudah hadir dalam hidupku. Kamu adalah alasan aku tersenyum setiap hari, tempat aku pulang saat dunia terasa berat, dan orang yang paling aku syukuri.\n\nCintaku ke kamu sebesar langit dan tak akan habis dimakan waktu. Apa pun yang terjadi, aku mau terus jalan bareng kamu.\n\nAku sayang kamu, hari ini, besok, dan selamanya. ❤"
  };

  var data = Object.assign({}, DEFAULT);
  try{
    var saved = localStorage.getItem("loveData");
    if(saved) data = Object.assign(data, JSON.parse(saved));
  }catch(e){}

  var $ = function(id){return document.getElementById(id)};
  var typingTimer = null;

  function typeMessage(text){
    var el = $("message");
    el.textContent = "";
    var i = 0;
    clearInterval(typingTimer);
    typingTimer = setInterval(function(){
      el.textContent += text.charAt(i);
      i++;
      if(i >= text.length) clearInterval(typingTimer);
    }, 38);
  }

  function apply(){
    $("nameSpan").textContent = data.name;
    $("heartText").textContent = data.heart;
    $("sign").textContent = data.sign;
    document.title = "Untuk " + data.name + " ❤";
    typeMessage(data.msg);
  }

  // isi form
  function fillForm(){
    $("inName").value = data.name;
    $("inHeart").value = data.heart;
    $("inMsg").value = data.msg;
    $("inSign").value = data.sign;
  }

  $("saveBtn").onclick = function(){
    data.name = $("inName").value.trim() || DEFAULT.name;
    data.heart = $("inHeart").value.trim() || DEFAULT.heart;
    data.msg = $("inMsg").value.trim() || DEFAULT.msg;
    data.sign = $("inSign").value.trim() || DEFAULT.sign;
    try{ localStorage.setItem("loveData", JSON.stringify(data)); }catch(e){}
    apply();
    rain(30);
  };
  $("resetBtn").onclick = function(){
    data = Object.assign({}, DEFAULT);
    try{ localStorage.removeItem("loveData"); }catch(e){}
    fillForm(); apply();
  };

  // hati melayang
  var emojis = ["❤","💖","💕","💗","💓","💘","🌹"];
  function spawn(){
    var h = document.createElement("div");
    h.className = "float";
    h.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    h.style.left = Math.random()*100 + "vw";
    h.style.fontSize = (16 + Math.random()*30) + "px";
    var dur = 5 + Math.random()*6;
    h.style.animationDuration = dur + "s";
    $("hearts").appendChild(h);
    setTimeout(function(){ h.remove(); }, dur*1000);
  }
  function rain(n){
    for(var i=0;i<n;i++) setTimeout(spawn, i*70);
  }
  setInterval(spawn, 600);

  // musik
  var player = $("player");
  function setTrack(src, label){
    player.src = src;
    $("trackName").textContent = "🎶 " + label;
    var p = player.play();
    if(p && p.catch) p.catch(function(){});
  }
  $("musicFile").addEventListener("change", function(e){
    var f = e.target.files[0];
    if(!f) return;
    setTrack(URL.createObjectURL(f), f.name);
  });
  $("musicUrl").addEventListener("keydown", function(e){
    if(e.key === "Enter" && this.value.trim()){
      setTrack(this.value.trim(), this.value.trim());
    }
  });
  $("playBtn").onclick = function(){
    if(!player.src){ $("trackName").textContent = "Pilih lagu dulu ya 💕"; return; }
    if(player.paused) player.play(); else player.pause();
  };

  // klik hati
  $("heart").onclick = function(){
    rain(40);
    if(player.src && player.paused){
      var p = player.play(); if(p && p.catch) p.catch(function(){});
    }
  };

  fillForm();
  apply();
  rain(25);
})();
</script>
</body>
</html>
